# Real Postgres for local development, as an alternative to the PGlite
# socket shim in `scripts/db-server.mjs`.
#
# WHY THIS EXISTS
#
# The shim is Postgres compiled to WebAssembly behind a single connection.
# It is genuinely useful — no install, no daemon, works on a locked-down
# machine — and it is also the least reliable component in the repo. It
# wedges while still holding port 5432, so `netstat` reports LISTENING for
# a process that answers nothing; it needs `connection_limit=1&pgbouncer=true`
# on every URL because concurrent prepared statements collide; and
# `vitest.config.ts` sets `fileParallelism: false` purely to keep it alive.
# Twice during development it corrupted its own data directory badly enough
# to need a delete, migrate, seed and re-provision.
#
# None of those are problems with real Postgres.
#
# USING IT
#
#   docker compose up -d db
#   # then point both URLs at it:
#   #   DATABASE_URL=postgresql://razorgrowth:razorgrowth@127.0.0.1:5433/razorgrowth
#   #   TEST_DATABASE_URL=postgresql://razorgrowth:razorgrowth@127.0.0.1:5433/razorgrowth
#   pnpm db:migrate && pnpm db:seed && pnpm db:identities
#
# Port 5433, not 5432, so this can run alongside the shim rather than
# fighting it for the port — switching is then an .env edit, not a
# process hunt.
#
# The credentials below are deliberately trivial and deliberately bound to
# 127.0.0.1 only: this is a disposable local fixture database holding
# seeded demo data, never anything real. `assertLocalDatabase` in
# `src/test-helpers/vitest-setup.ts` still refuses to run the suite
# against any host that is not local, and that guard is what actually
# protects the hosted database — not this file.
#
# NOT YET VERIFIED ON THIS MACHINE: Docker is not installed here, so this
# compose file has been written against the documented images and flags
# but never started. Treat the first `docker compose up` as the test.
services:
  db:
    image: postgres:16-alpine
    container_name: razorgrowth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: razorgrowth
      POSTGRES_PASSWORD: razorgrowth
      POSTGRES_DB: razorgrowth
      # Deterministic collation, so ORDER BY in tests does not depend on
      # the host's locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - razorgrowth-db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` is the check the app actually needs: it answers only
      # when the server will accept a query, which is the distinction the
      # PGlite shim could not make.
      test: ["CMD-SHELL", "pg_isready -U razorgrowth -d razorgrowth"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  razorgrowth-db-data:
