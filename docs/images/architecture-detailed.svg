<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
<title id="title">VETTRI VAANIGAM detailed architecture and trust boundaries</title>
<desc id="desc">Six numbered layers show clients, API validation, buyer and merchant intelligence, deterministic authorization, commerce with verified Razorpay outcomes, and PostgreSQL persistence. Optional AI has no financial authority. Weekly job delivery is marked partial.</desc>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#546b89"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#142b49}
.title{font-size:38px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:19px;fill:#405772}.s{font-size:16px;fill:#405772}
.k{font-size:15px;fill:#2464aa;font-weight:700;letter-spacing:1.4px}
.box{fill:#fff;stroke:#c2d0df;stroke-width:1.5}
.line{fill:none;stroke:#546b89;stroke-width:2;marker-end:url(#a)}
</style></defs>
<rect width="1600" height="1500" rx="24" fill="#f3f6fb"/>
<text x="48" y="45" class="k">RAZORPAY INTERNSHIP PORTFOLIO / TECHNICAL ARCHITECTURE</text>
<text x="48" y="98" class="title">VETTRI VAANIGAM</text>
<text x="455" y="97" font-size="29">From buyer intent to verified commerce</text>
<text x="48" y="135" class="b">One modular backend. Explicit trust boundaries. No direct path from an AI suggestion to money movement.</text>

<text x="48" y="178" class="k">01 / CLIENTS — UNTRUSTED REQUESTS</text>
<rect x="48" y="193" width="484" height="96" rx="12" class="box"/>
<text x="70" y="228" class="h">Buyer web experience</text>
<text x="70" y="259" class="b">React · conversation · discovery · checkout</text>
<rect x="558" y="193" width="484" height="96" rx="12" class="box"/>
<text x="580" y="228" class="h">Merchant workspace</text>
<text x="580" y="259" class="b">Today · opportunities · controls · activity</text>
<rect x="1068" y="193" width="484" height="96" rx="12" class="box"/>
<text x="1090" y="228" class="h">External AI buyers</text>
<text x="1090" y="259" class="b">Gateway and protocol-specific endpoints</text>
<path class="line" d="M290 289V329"/><path class="line" d="M800 289V329"/><path class="line" d="M1310 289V329"/>

<rect x="48" y="329" width="1504" height="99" rx="12" fill="#173d6c"/>
<text x="70" y="366" class="h" style="fill:#fff">02 / FASTIFY API — FIRST TRUST BOUNDARY</text>
<text x="70" y="399" font-size="20" fill="#fff" style="fill:#dceafb">Zod validation · authentication and tenant scope · role checks · rate limits · request correlation · protocol adapters</text>

<text x="48" y="471" class="k">03 / INTELLIGENCE — PROPOSALS, NOT AUTHORITY</text>
<rect x="48" y="489" width="513" height="166" rx="12" class="box"/>
<text x="70" y="525" class="h">Buyer Agent</text>
<text x="70" y="559" class="b">Extract intent and constraints</text>
<text x="70" y="589" class="b">Ground recommendations in catalogue data</text>
<text x="70" y="619" class="b">Apply buyer purchase permissions</text>
<rect x="585" y="489" width="513" height="166" rx="12" class="box"/>
<text x="607" y="525" class="h">Merchant Agent</text>
<text x="607" y="559" class="b">Detect opportunities from merchant records</text>
<text x="607" y="589" class="b">Propose offers, recovery and growth actions</text>
<text x="607" y="619" class="b">Existing tools share governed handlers</text>
<path class="line" d="M290 428V445 M290 478V489"/><path class="line" d="M800 428V445 M800 478V489"/>
<rect x="1140" y="489" width="412" height="166" rx="12" fill="#edf2ff" stroke="#b6c6e3"/>
<text x="1162" y="525" class="h">Optional language models</text>
<text x="1162" y="559" class="b">Anthropic / Gemini integration</text>
<text x="1162" y="589" class="b">Labeled rule-based fallback</text>
<text x="1162" y="619" class="s">Assistance only; no payment credentials</text>
<path class="line" d="M1098 545H1140"/>
<text x="1119" y="533" class="s" text-anchor="middle">AI</text>

<path class="line" d="M304 655V678 M304 713V724"/><path class="line" d="M841 655V678 M841 713V724"/>
<text x="48" y="703" class="k">04 / DETERMINISTIC POLICY — FINANCIAL TRUST BOUNDARY</text>
<rect x="48" y="724" width="1050" height="165" rx="12" fill="#e4f2ed" stroke="#79ad99" stroke-width="1.5"/>
<text x="70" y="760" class="h">Policy evaluation → approval when required → bounded authorization</text>
<text x="70" y="792" class="b">Action eligibility · discount ceilings · proposal fingerprint · policy version · expiry</text>
<rect x="70" y="813" width="233" height="49" rx="8" fill="#fff" stroke="#9bb8aa"/>
<text x="91" y="845" font-size="19" font-weight="700">DENY → stop safely</text>
<rect x="324" y="813" width="365" height="49" rx="8" fill="#fff" stroke="#9bb8aa"/>
<text x="345" y="845" font-size="19" font-weight="700">REQUIRE APPROVAL → owner/role</text>
<rect x="710" y="813" width="366" height="49" rx="8" fill="#fff" stroke="#9bb8aa"/>
<text x="731" y="845" font-size="19" font-weight="700">ALLOW → scoped authorization</text>
<rect x="1140" y="724" width="412" height="165" rx="12" fill="#fff6e7" stroke="#b67b24" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="1162" y="760" class="h">Weekly plans: partial layer</text>
<text x="1162" y="793" class="b">Snapshots · approvals · job records</text>
<text x="1162" y="824" class="b">Consent/contact-limited drafts</text>
<text x="1162" y="854" class="s">Delivery adapters / full executors pending</text>

<path class="line" d="M573 889V957"/>
<text x="594" y="925" class="s">Authorization is not a payment receipt</text>
<text x="48" y="941" class="k">05 / EXECUTION — VERIFIED OUTCOMES</text>
<rect x="48" y="957" width="1050" height="151" rx="12" class="box"/>
<text x="70" y="994" class="h">Commerce, orders and payment state</text>
<text x="70" y="1028" class="b">Recheck authorization · calculate server-side totals · check stock · consume authorization</text>
<text x="70" y="1060" class="b">Idempotent checkout / payment operations · signed webhook handling · reconciliation</text>
<text x="70" y="1087" class="s">Uncertain payment state remains unresolved until provider evidence supports a transition.</text>
<rect x="1140" y="957" width="412" height="151" rx="12" fill="#edf2ff" stroke="#b6c6e3"/>
<text x="1162" y="994" class="h">Razorpay Test Mode</text>
<text x="1162" y="1028" class="b">Create / fetch provider payment</text>
<text x="1162" y="1060" class="b">Signed webhook → API verification</text>
<text x="1162" y="1087" class="s">Configured keys required; mock in tests</text>
<path class="line" d="M1098 1011H1140"/><path class="line" d="M1140 1069H1098"/>

<path class="line" d="M573 1108V1140"/>
<rect x="48" y="1140" width="1504" height="161" rx="12" fill="#173d6c"/>
<text x="70" y="1179" class="h" style="fill:#fff">06 / PERSISTENCE AND EVIDENCE — PRISMA + POSTGRESQL</text>
<line x1="540" y1="1200" x2="540" y2="1277" stroke="#6080a7"/><line x1="1040" y1="1200" x2="1040" y2="1277" stroke="#6080a7"/>
<text x="70" y="1224" font-size="21" font-weight="700" style="fill:#fff">Business state</text>
<text x="70" y="1256" font-size="19" style="fill:#dceafb">Catalogue · customers · orders · payments</text>
<text x="562" y="1224" font-size="21" font-weight="700" style="fill:#fff">Governance records</text>
<text x="562" y="1256" font-size="19" style="fill:#dceafb">Policies · approvals · authorizations · jobs</text>
<text x="1062" y="1224" font-size="21" font-weight="700" style="fill:#fff">Audit evidence</text>
<text x="1062" y="1256" font-size="19" style="fill:#dceafb">Hash-chained events · outcome links</text>
<text x="70" y="1285" font-size="15" style="fill:#dceafb">All API modules share this data layer. Local development uses PGlite. The ledger provides tamper evidence, not immutable storage.</text>

<text x="48" y="1345" class="k">CROSS-CUTTING ENGINEERING</text>
<text x="48" y="1380" class="b">Shared TypeScript domain rules + Zod contracts · structured logs · Vitest / Testing Library · typecheck / lint / build · CI</text>
<line x1="48" y1="1408" x2="1552" y2="1408" stroke="#c2d0df"/>
<text x="48" y="1440" class="s">Reading guide: follow 01–06 for the purchase path. Right-hand boxes describe providers and the incomplete weekly-plan execution layer.</text>
<text x="48" y="1468" class="s">Solid boxes show current modules; the dashed box is partial. This is a modular monolith, not a distributed microservices or production-certification claim.</text>
</svg>
