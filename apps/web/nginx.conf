server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Client-side routing: any unmatched path must fall back to
    # index.html, or a hard refresh on /trust-trace returns a 404 from
    # nginx instead of loading the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so these are safe to
    # cache indefinitely. index.html deliberately is NOT — it is the
    # file that points at the current hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Baseline security headers. Note: HSTS is intentionally NOT set
    # here — it belongs at the TLS-terminating layer (load balancer /
    # CDN), and setting it from a container that may be reached over
    # plain HTTP internally can lock clients out.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
