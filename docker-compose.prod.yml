services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: razorgrowth-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      ACP_DELEGATION_TOKEN_SECRET: ${ACP_DELEGATION_TOKEN_SECRET}
      DATA_FINGERPRINT_SECRET: ${DATA_FINGERPRINT_SECRET}
      SESSION_VALIDITY_HOURS: ${SESSION_VALIDITY_HOURS:-12}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    container_name: razorgrowth-web-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
